[package]
name = "rupicola-capture"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
authors = ["LucasBRT <lucasbritodepaula@proton.me>"]
description = "Headless UI capture backends (Linux X11/Xvfb, Wayland, Web) and visual annotation engine for rupicola-protocol"
repository = "https://github.com/Lucas-BRT/rupicola-protocol"
publish = false

[lints]
workspace = true

[dependencies]
rupicola-protocol = { path = ".." }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
