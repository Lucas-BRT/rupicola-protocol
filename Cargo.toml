[workspace]
members = ["crates/rupicola-protocol", "crates/rupicola-capture", "tools/example-capture"]
default-members = ["crates/rupicola-protocol", "crates/rupicola-capture", "tools/example-capture"]
exclude = ["examples/apps/medium/notes/gtk4"]
resolver = "2"

[workspace.dependencies]
rupicola-protocol = { path = "crates/rupicola-protocol" }
rupicola-capture = { path = "crates/rupicola-capture" }
async-trait = "=0.1.92"
maybe-async-cfg = "=0.2.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = "=1.54.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_broken_link = "deny"
ignore_without_reason = "deny"
invalid_upcast_comparisons = "deny"
maybe_infinite_iter = "deny"
should_panic_without_expect = "deny"
unsafe_derive_deserialize = "deny"

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
